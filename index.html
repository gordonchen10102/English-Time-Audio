<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Time 1 Audio</title>
<style>
  :root { --bg:#f7f5ef; --card:#fff; --text:#222; --muted:#666; --accent:#2f7d5b; --soft:#e6f2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1d1c; --card:#262927; --text:#eee; --muted:#aaa; --accent:#5cc49a; --soft:#2d3a33; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:28px 16px 8px; text-align:center; }
  h1 { margin:0 0 6px; font-size:1.8rem; color:var(--accent); }
  header p { margin:0; color:var(--muted); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .units { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .units button { border:0; border-radius:999px; padding:8px 14px; font-size:.95rem; cursor:pointer;
                  background:var(--soft); color:var(--text); }
  .units button.on { background:var(--accent); color:#fff; }
  h2 { font-size:1.15rem; margin:22px 0 10px; color:var(--accent); }
  .track { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:10px;
           box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row span { font-size:1rem; }
  .play { border:0; border-radius:10px; padding:8px 14px; background:var(--accent); color:#fff;
          font-size:.95rem; cursor:pointer; white-space:nowrap; }
  iframe { width:100%; height:64px; border:0; margin-top:10px; border-radius:8px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:24px 16px; }
</style>
</head>
<body>
<header>
  <h1>English Time 1 🎧</h1>
  <p>Choose a unit, then tap Play</p>
</header>
<main>
  <div class="units" id="units"></div>
  <div id="list"></div>
</main>
<footer>For students and parents of our class</footer>

const unitsEl = document.getElementById("units"), list = document.getElementById("list");
function show(u) {
  [...unitsEl.children].forEach((b,i)=>b.classList.toggle("on", (u===0 && i===0) || i===u));
  list.innerHTML = "";
  data.filter(d => u===0 || d.unit===u).forEach(d => {
    const h = document.createElement("h2");
    h.textContent = `Unit ${d.unit} · ${d.name}`;
    list.appendChild(h);
    d.tracks.forEach(t => {
      const div = document.createElement("div");
      div.className = "track";
      div.innerHTML = `<div class="row"><span></span><button class="play">▶ Play</button></div>`;
      div.querySelector("span").textContent = `${t.icon} ${t.title}`;
      div.querySelector("button").onclick = e => {
        document.querySelectorAll(".track iframe").forEach(f => f.remove());
        document.querySelectorAll(".play").forEach(b => b.style.display = "");
        const f = document.createElement("iframe");
        f.src = `https://drive.google.com/file/d/${t.id}/preview`;
        f.allow = "autoplay";
        div.appendChild(f);
        e.target.style.display = "none";
      };
      list.appendChild(div);
    });
  });
}
const all = document.createElement("button"); all.textContent = "All"; all.onclick = () => show(0); unitsEl.appendChild(all);
data.forEach(d => { const b = document.createElement("button"); b.textContent = "Unit " + d.unit; b.onclick = () => show(d.unit); unitsEl.appendChild(b); });
show(1);
</script>
</body>
</html>
