<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Time 1 Audio</title>
<style>
  :root { --bg:#f7f5ef; --card:#fff; --text:#222; --muted:#666; --accent:#2f7d5b; --soft:#e6f2ec; --song:#c2571a; --songsoft:#fbe9dd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1d1c; --card:#262927; --text:#eee; --muted:#aaa; --accent:#5cc49a; --soft:#2d3a33; --song:#f09a5e; --songsoft:#3d2c21; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding-bottom:150px; }
  header { padding:24px 16px 4px; text-align:center; }
  h1 { margin:0 0 4px; font-size:1.8rem; color:var(--accent); }
  header p { margin:0; color:var(--muted); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .quick { background:var(--card); border-radius:16px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .quick h2 { margin:0 0 4px; font-size:1.2rem; color:var(--text); }
  .quick p { margin:0 0 12px; color:var(--muted); font-size:.95rem; }
  .qgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qbtn { border:0; border-radius:14px; padding:16px 10px; font-size:1.1rem; font-weight:600; cursor:pointer;
          background:var(--accent); color:#fff; line-height:1.3; }
  .qbtn small { display:block; font-weight:400; font-size:.8rem; opacity:.9; }
  .qbtn.songs { grid-column:1 / -1; background:var(--song); font-size:1.25rem; }
  .qbtn.all { grid-column:1 / -1; background:var(--soft); color:var(--text); }
  h3 { font-size:1.1rem; margin:28px 0 10px; color:var(--accent); }
  .units { display:flex; flex-wrap:wrap; gap:8px; }
  .units button { border:0; border-radius:999px; padding:8px 14px; font-size:.95rem; cursor:pointer; background:var(--soft); color:var(--text); }
  .units button.on { background:var(--accent); color:#fff; }
  .uhead { font-size:1.05rem; margin:20px 0 8px; color:var(--accent); font-weight:600; }
  .track { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--card); border-radius:12px;
           padding:10px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); border:2px solid transparent; }
  .track.song { background:var(--songsoft); }
  .track.now { border-color:var(--accent); }
  .track button { border:0; border-radius:10px; padding:8px 14px; background:var(--accent); color:#fff; font-size:.95rem; cursor:pointer; white-space:nowrap; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); box-shadow:0 -2px 10px rgba(0,0,0,.15); padding:10px 16px 14px; display:none; }
  .bar.show { display:block; }
  .bar .inner { max-width:720px; margin:0 auto; }
  .bar .label { font-size:.85rem; color:var(--muted); }
  .bar .title { font-weight:600; margin:2px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .ctrls { display:flex; align-items:center; gap:8px; }
  .bar .ctrls button { border:0; border-radius:10px; width:44px; height:40px; font-size:1.1rem; background:var(--soft); color:var(--text); cursor:pointer; }
  .bar audio { flex:1; min-width:0; height:40px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:24px 16px; }
</style>
</head>
<body>
<header>
  <h1>English Time 1 🎧</h1>
  <p>Listen and practise at home</p>
</header>
<main>
  <section class="quick">
    <h2>▶ Quick Play</h2>
    <p>Tap one button. Everything plays one after another.</p>
    <div class="qgrid">
      <button class="qbtn songs" data-q="songs">🎵 All Songs<small>12 songs</small></button>
      <button class="qbtn" data-q="1-3">Units 1–3<small>15 tracks</small></button>
      <button class="qbtn" data-q="4-6">Units 4–6<small>15 tracks</small></button>
      <button class="qbtn" data-q="7-9">Units 7–9<small>15 tracks</small></button>
      <button class="qbtn" data-q="10-12">Units 10–12<small>15 tracks</small></button>
      <button class="qbtn all" data-q="all">Play Everything<small>all 60 tracks</small></button>
    </div>
  </section>

  <h3>Or choose one track</h3>
  <div class="units" id="units"></div>
  <div id="list"></div>
</main>
<footer>For students and parents of our class</footer>

<div class="bar" id="bar">
  <div class="inner">
    <div class="label" id="label"></div>
    <div class="title" id="nowTitle"></div>
    <div class="ctrls">
      <button id="prev" aria-label="Previous">⏮</button>
      <audio id="player" controls></audio>
      <button id="next" aria-label="Next">⏭</button>
    </div>
  </div>
</div>

, {"u": 3, "icon": "✏️", "title": "Practice Time", "song": false, "file": "13 Unit 3 On The Farm Practice Time A Listen And Repeat.mp3"}, {"u": 3, "icon": "🎵", "title": "Song: What's This?", "song": true, "file": "14 Unit 3 On The Farm Practice Time D Listen And Sing along(What_s This_).mp3"}, {"u": 3, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "15 Unit 3 On The Farm Phonics Time A Listen And Repeat.mp3"}, {"u": 4, "icon": "💬", "title": "Conversation Time", "song": false, "file": "16 Unit 4 At The Stationery Store Conversation Time A Listen And Repeart.mp3"}, {"u": 4, "icon": "🔤", "title": "Word Time", "song": false, "file": "17 Unit 4 At The Stationery Store Word Time A Listen And Repeart.mp3"}, {"u": 4, "icon": "✏️", "title": "Practice Time", "song": false, "file": "18 Unit 4 At The Stationery Store Practice Time A Listen And Repeat.mp3"}, {"u": 4, "icon": "🎵", "title": "Song: Thanks. You're Welcome.", "song": true, "file": "19 Unit 4 At The Stationery Store Practice Time D Listen And Sing along(Thanks. You_re Welcome.).mp3"}, {"u": 4, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "20 Unit 4 At The Stationery Store Phonics Time A Listen And Repeat.mp3"}, {"u": 5, "icon": "💬", "title": "Conversation Time", "song": false, "file": "21 Unit 5 At School Conversation Time A Listen And Repeart.mp3"}, {"u": 5, "icon": "🔤", "title": "Word Time", "song": false, "file": "22 Unit 5 At School Word Time A Listen And Repeart.mp3"}, {"u": 5, "icon": "✏️", "title": "Practice Time", "song": false, "file": "23 Unit 5 At School Practice Time A Listen And Repeat.mp3"}, {"u": 5, "icon": "🎵", "title": "Song: The Counting Chant", "song": true, "file": "24 Unit 5 At School Practice Time D Listen And Sing along(The Counting Chart).mp3"}, {"u": 5, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "25 Unit 5 At School Phonics Time A Listen And Repeat.mp3"}, {"u": 6, "icon": "💬", "title": "Conversation Time", "song": false, "file": "26 Unit 6 In Gym Class Conversation Time A Listen And Repeart.mp3"}, {"u": 6, "icon": "🔤", "title": "Word Time", "song": false, "file": "27 Unit 6 In Gym Class Word Time A Listen And Repeart.mp3"}, {"u": 6, "icon": "✏️", "title": "Practice Time", "song": false, "file": "28 Unit 6 In Gym Class Practice Time A Listen And Repeat.mp3"}, {"u": 6, "icon": "🎵", "title": "Song: Are You Happy?", "song": true, "file": "29 Unit 6 In Gym Class Practice Time D Listen And Sing along(Are You Happy_).mp3"}, {"u": 6, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "30 Unit 6 In Gym Class Phonics Time A Listen And Repeat.mp3"}, {"u": 7, "icon": "💬", "title": "Conversation Time", "song": false, "file": "31 Unit 7 At The Food Court Conversation Time A Listen And Repeart.mp3"}, {"u": 7, "icon": "🔤", "title": "Word Time", "song": false, "file": "32 Unit 7 At The Food Court Word Time A Listen And Repeart.mp3"}, {"u": 7, "icon": "✏️", "title": "Practice Time", "song": false, "file": "33 Unit 7 At The Food Court Practice Time A Listen And Repeat.mp3"}, {"u": 7, "icon": "🎵", "title": "Song: I Like Pizza", "song": true, "file": "34 Unit 7 At The Food Court Practice Time D Listen And Sing along(I Like Pizza).mp3"}, {"u": 7, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "35 Unit 7 At The Food Court Phonics Time A Listen And Repeat.mp3"}, {"u": 8, "icon": "💬", "title": "Conversation Time", "song": false, "file": "36 Unit 8 At The Supermarket Conversation Time A Listen And Repeart.mp3"}, {"u": 8, "icon": "🔤", "title": "Word Time", "song": false, "file": "37 Unit 8 At The Supermarket Word Time A Listen And Repeart.mp3"}, {"u": 8, "icon": "✏️", "title": "Practice Time", "song": false, "file": "38 Unit 8 At The Supermarket Practice Time A Listen And Repeat.mp3"}, {"u": 8, "icon": "🎵", "title": "Song: Yum! Yum! Yum!", "song": true, "file": "39 Unit 8 At The Supermarket Practice Time D Listen And Sing along(Yum! Yum! Yum!).mp3"}, {"u": 8, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "40 Unit 8 At The Supermarket Phonics Time A Listen And Repeat.mp3"}, {"u": 9, "icon": "💬", "title": "Conversation Time", "song": false, "file": "41 Unit 9 At The Circus Conversation Time A Listen And Repeart.mp3"}, {"u": 9, "icon": "🔤", "title": "Word Time", "song": false, "file": "42 Unit 9 At The Circus Word Time A Listen And Repeart.mp3"}, {"u": 9, "icon": "✏️", "title": "Practice Time", "song": false, "file": "43 Unit 9 At The Circus Practice Time A Listen And Repeat.mp3"}, {"u": 9, "icon": "🎵", "title": "Song: The Tall/Short Chant", "song": true, "file": "44 Unit 9 At The Circus Practice Time D Listen And Sing along(The Tall_Short Chant).mp3"}, {"u": 9, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "45 Unit 9 At The Circus Phonics Time A Listen And Repeat.mp3"}, {"u": 10, "icon": "💬", "title": "Conversation Time", "song": false, "file": "46 Unit 10 Around Town Conversation Time A Listen And Repeart.mp3"}, {"u": 10, "icon": "🔤", "title": "Word Time", "song": false, "file": "47 Unit 10 Around Town Word Time A Listen And Repeart.mp3"}, {"u": 10, "icon": "✏️", "title": "Practice Time", "song": false, "file": "48 Unit 10 Around Town Practice Time A Listen And Repeat.mp3"}, {"u": 10, "icon": "🎵", "title": "Song: The Work Song", "song": true, "file": "49 Unit 10 Around Town Practice Time D Listen And Sing along(The Work Song).mp3"}, {"u": 10, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "50 Unit 10 Around Town Phonics Time A Listen And Repeat.mp3"}, {"u": 11, "icon": "💬", "title": "Conversation Time", "song": false, "file": "51 Unit 11 In Annie_s Yard Conversation Time A Listen And Repeart.mp3"}, {"u": 11, "icon": "🔤", "title": "Word Time", "song": false, "file": "52 Unit 11 In Annie_s Yard Word Time A Listen And Repeart.mp3"}, {"u": 11, "icon": "✏️", "title": "Practice Time", "song": false, "file": "53 Unit 11 In Annie_s Yard Practice Time A Listen And Repeat.mp3"}, {"u": 11, "icon": "🎵", "title": "Song: She Can Ride a Bike", "song": true, "file": "54 Unit 11 In Annie_s Yard Practice Time D Listen And Sing along(She Can Ride O Bike).mp3"}, {"u": 11, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "55 Unit 11 In Annie_s Yard Phonics Time A Listen And Repeat.mp3"}, {"u": 12, "icon": "💬", "title": "Conversation Time", "song": false, "file": "56 Unit 12 At The Park Conversation Time A Listen And Repeart.mp3"}, {"u": 12, "icon": "🔤", "title": "Word Time", "song": false, "file": "57 Unit 12 At The Park Word Time A Listen And Repeart.mp3"}, {"u": 12, "icon": "✏️", "title": "Practice Time", "song": false, "file": "58 Unit 12 At The Park Practice Time A Listen And Repeat.mp3"}, {"u": 12, "icon": "🎵", "title": "Song: The Kite Song", "song": true, "file": "59 Unit 12 At The Park Practice Time D Listen And Sing along(The Kite Song).mp3"}, {"u": 12, "icon": "🔊", "title": "Phonics Time", "song": false, "file": "60 Unit 12 At The Park Phonics Time A Listen And Repeat.mp3"}]};
const T = DATA.tracks;
const player = document.getElementById("player"), bar = document.getElementById("bar");
let queue = [], pos = 0, queueName = "";

function name(t){ return `Unit ${t.u} · ${t.title}`; }
function play(list, start, label){
  queue = list; pos = start || 0; queueName = label;
  load();
}
function load(){
  const t = queue[pos];
  player.src = encodeURI(t.file);
  player.play().catch(()=>{});
  bar.classList.add("show");
  document.getElementById("label").textContent = queue.length > 1 ? `${queueName} — ${pos+1} of ${queue.length}` : queueName;
  document.getElementById("nowTitle").textContent = `${t.icon} ${name(t)}`;
  document.querySelectorAll(".track").forEach(el => el.classList.toggle("now", el.dataset.file === t.file));
}
player.addEventListener("ended", () => { if (pos < queue.length - 1) { pos++; load(); } });
document.getElementById("next").onclick = () => { if (pos < queue.length - 1) { pos++; load(); } };
document.getElementById("prev").onclick = () => { if (player.currentTime > 3 || pos === 0) { player.currentTime = 0; } else { pos--; load(); } };

const quick = {
  "songs": [T.filter(t => t.song), "All Songs"],
  "1-3": [T.filter(t => t.u <= 3), "Units 1–3"],
  "4-6": [T.filter(t => t.u >= 4 && t.u <= 6), "Units 4–6"],
  "7-9": [T.filter(t => t.u >= 7 && t.u <= 9), "Units 7–9"],
  "10-12": [T.filter(t => t.u >= 10), "Units 10–12"],
  "all": [T, "Everything"]
};
document.querySelectorAll(".qbtn").forEach(b => b.onclick = () => { const [l, n] = quick[b.dataset.q]; play(l, 0, n); });

const unitsEl = document.getElementById("units"), list = document.getElementById("list");
function show(u){
  [...unitsEl.children].forEach((b,i) => b.classList.toggle("on", i === u - 1));
  list.innerHTML = "";
  const h = document.createElement("div"); h.className = "uhead";
  h.textContent = `Unit ${u} · ${DATA.units[u-1]}`; list.appendChild(h);
  const ut = T.filter(t => t.u === u);
  ut.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "track" + (t.song ? " song" : "");
    d.dataset.file = t.file;
    d.innerHTML = `<span></span><button>▶ Play</button>`;
    d.querySelector("span").textContent = `${t.icon} ${t.title}`;
    d.querySelector("button").onclick = () => play(ut, i, `Unit ${u}`);
    list.appendChild(d);
  });
  const cur = queue[pos]; if (cur) document.querySelectorAll(".track").forEach(el => el.classList.toggle("now", el.dataset.file === cur.file));
}
DATA.units.forEach((n, i) => { const b = document.createElement("button"); b.textContent = "Unit " + (i+1); b.onclick = () => show(i+1); unitsEl.appendChild(b); });
show(1);
</script>
</body>
</html>
